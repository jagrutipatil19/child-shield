<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - ChildShild</title>

    <link rel="stylesheet" href="register.css">
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <header>

        <nav class="navbar">

            <div class="logo">
                🛡️ ChildShild
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="awareness.html">Awareness</a>
                </li>

                <li>
                    <a href="report.html">Report</a>
                </li>

                <li>
                    <a href="login.html">Login</a>
                </li>

                <li>
                    <a href="register.html" class="active">Register</a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- =========================
         REGISTER SECTION
    ========================== -->

    <section class="form-section">

        <div class="form-container">

            <h1>Create Account</h1>

            <p>
                Register to access your ChildSafe account.
            </p>


            <!-- REGISTER FORM -->

            <form id="registerForm">

                <!-- NAME -->

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >


                <!-- EMAIL -->

                <label for="registerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >


                <!-- PASSWORD -->

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                >


                <!-- CONFIRM PASSWORD -->

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >


                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Register
                </button>

                <!-- Feedback Message -->
                <p id="authMessage" style="text-align:center; margin-top:15px; font-weight:bold;"></p>

            </form>


            <!-- LOGIN LINK -->

            <p class="form-link">

                Already have an account?

                <a href="login.html">
                    Login here
                </a>

            </p>

        </div>

    </section>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 ChildShild | Protect Every Child
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="web.js"></script>
    
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./Backend/supabase.js"></script>
<script src="./Backend/auth.js"></script>


</body>

</html>
